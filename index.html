<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="description" content="Alex McNab-Lundbäck — Health & Fitness dashboard" />
  <title>Alex · Health & Fitness</title>
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elev: #121821;
      --bg-card: #161e2a;
      --border: #243044;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3dd68c;
      --accent-dim: rgba(61, 214, 140, 0.15);
      --warn: #f5a524;
      --info: #5b9dff;
      --run: #5b9dff;
      --strength: #c084fc;
      --rest: #6b7a90;
      --parkrun: #f5a524;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --font: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 10% -10%, #152032 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 1rem 1rem 3rem;
    }
    header.hero {
      display: flex;
      flex-direction: column;
      gap: .65rem;
      padding: 1.25rem 1.1rem;
      background: linear-gradient(135deg, #152033, #0f1622 60%);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--shadow);
      margin-bottom: 1rem;
    }
    .eyebrow {
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4.5vw, 1.9rem);
      font-weight: 750;
      letter-spacing: -.02em;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem .85rem;
      color: var(--muted);
      font-size: .88rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .28rem .65rem;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: .78rem;
      font-weight: 650;
      border: 1px solid rgba(61,214,140,.25);
    }
    .updated {
      font-weight: 650;
      color: var(--text);
    }
    .updated time { color: var(--accent); }
    .goal {
      margin-top: .15rem;
      font-size: .92rem;
      color: var(--muted);
    }
    .goal strong { color: var(--text); font-weight: 650; }

    section {
      margin: 1rem 0;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: .75rem;
      margin: 0 0 .65rem .15rem;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .section-head .hint {
      font-size: .75rem;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: .75rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 560px) {
      .grid.cols-2 { grid-template-columns: 1fr 1fr; }
      .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
      .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 720px) {
      .grid.cols-4-lg { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .95rem 1rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
    }
    .card.highlight {
      border-color: rgba(61,214,140,.35);
      background: linear-gradient(180deg, rgba(61,214,140,.08), var(--bg-card));
    }
    .stat-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: .2rem;
      font-weight: 650;
    }
    .stat-value {
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.sm { font-size: 1.05rem; }
    .stat-sub {
      margin-top: .2rem;
      font-size: .8rem;
      color: var(--muted);
    }
    .trend-up { color: var(--warn); }
    .source {
      margin-top: .75rem;
      font-size: .75rem;
      color: var(--muted);
    }
    .goal-overview {
      margin-bottom: .75rem;
    }
    .goal-target-note {
      margin: 0 0 .8rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .goal-target-note strong { color: var(--text); }
    .goal-progress-grid {
      gap: .75rem;
    }
    .goal-metric {
      padding: .85rem .9rem;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: .75rem;
      font-size: .82rem;
      color: var(--muted);
    }
    .progress-label strong {
      color: var(--text);
      font-size: .92rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .progress-track {
      height: .5rem;
      margin-top: .7rem;
      overflow: hidden;
      border-radius: 999px;
      background: #0b111a;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #8af0bc);
      transition: width .3s ease;
    }
    .progress-caption {
      margin-top: .45rem;
      color: var(--muted);
      font-size: .76rem;
      font-variant-numeric: tabular-nums;
    }
    .scenario-grid {
      display: grid;
      gap: .75rem;
    }
    .scenario-card {
      padding: .9rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .scenario-card.primary {
      border-color: rgba(61,214,140,.55);
      background: linear-gradient(180deg, rgba(61,214,140,.12), var(--bg-card));
      box-shadow: 0 2px 14px rgba(61,214,140,.08);
    }
    .scenario-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: .75rem;
    }
    .scenario-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }
    .scenario-badge {
      flex: 0 0 auto;
      padding: .2rem .5rem;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: .68rem;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .scenario-eta {
      margin: .35rem 0 .75rem;
      color: var(--muted);
      font-size: .8rem;
    }
    .scenario-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
    }
    .scenario-stats span {
      display: block;
      color: var(--muted);
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .scenario-stats strong {
      display: block;
      margin-top: .15rem;
      font-size: .95rem;
      font-variant-numeric: tabular-nums;
    }
    .scenario-note {
      margin: .7rem 0 0;
      padding-top: .6rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .8rem;
    }
    .goal-assumption,
    .goal-disclaimer {
      color: var(--muted);
      font-size: .8rem;
    }
    .goal-assumption { margin: .75rem .15rem .35rem; }
    .goal-disclaimer { margin: .35rem .15rem 0; }
    .goal-assumption strong,
    .goal-disclaimer strong { color: var(--text); }

    .badge {
      display: inline-block;
      padding: .15rem .5rem;
      border-radius: 6px;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .badge.rest { background: rgba(107,122,144,.2); color: var(--rest); }
    .badge.run { background: rgba(91,157,255,.18); color: var(--run); }
    .badge.strength { background: rgba(192,132,252,.18); color: var(--strength); }
    .badge.parkrun { background: rgba(245,165,36,.18); color: var(--parkrun); }

    .meal-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: .55rem;
    }
    .meal-list li {
      display: grid;
      grid-template-columns: 5.5rem 1fr;
      gap: .5rem;
      font-size: .92rem;
    }
    .meal-list .slot {
      color: var(--muted);
      font-weight: 650;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding-top: .15rem;
    }
    .notes {
      margin-top: .75rem;
      padding-top: .7rem;
      border-top: 1px solid var(--border);
      font-size: .85rem;
      color: var(--muted);
    }

    .week-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }
    .week-table th,
    .week-table td {
      text-align: left;
      padding: .55rem .4rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .week-table th {
      color: var(--muted);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
    }
    .week-table tr.today td {
      background: rgba(61,214,140,.08);
    }
    .week-table .day {
      font-weight: 650;
      white-space: nowrap;
    }
    .empty {
      color: var(--warn);
      font-weight: 650;
    }
    .prompt {
      font-size: .85rem;
      color: var(--muted);
      margin-top: .35rem;
    }
    .tips {
      display: grid;
      gap: .75rem;
    }
    .tip {
      padding: .85rem 1rem;
      border-radius: var(--radius);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      font-size: .9rem;
    }
    .tip strong {
      display: block;
      margin-bottom: .25rem;
      color: var(--accent);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    footer {
      margin-top: 2rem;
      padding: 1.25rem 0 .5rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .8rem;
      text-align: center;
    }
    .error {
      padding: 1rem;
      border: 1px solid #a33;
      background: #2a1212;
      border-radius: var(--radius);
      color: #ffb4b4;
    }
    .loading {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
    }
    .pace-row {
      display: flex;
      justify-content: space-between;
      gap: .5rem;
      padding: .4rem 0;
      border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .pace-row:last-child { border-bottom: 0; }
    .pace-row span:first-child { color: var(--muted); }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="loading" id="loading">Loading dashboard…</p>
  </div>

  <script>
    (function () {
      const app = document.getElementById("app");

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function fmtNum(n, digits) {
        if (n == null || Number.isNaN(n)) return "—";
        return Number(n).toLocaleString("en-SE", {
          maximumFractionDigits: digits == null ? 1 : digits,
          minimumFractionDigits: digits == null ? 0 : digits
        });
      }

      function localTodayISO() {
        // Dashboard timezone is Europe/Stockholm
        try {
          return new Intl.DateTimeFormat("en-CA", {
            timeZone: "Europe/Stockholm",
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
          }).format(new Date());
        } catch (e) {
          return new Date().toISOString().slice(0, 10);
        }
      }

      function addDaysISO(iso, days) {
        const [y, m, d] = iso.split("-").map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        dt.setUTCDate(dt.getUTCDate() + days);
        return dt.toISOString().slice(0, 10);
      }

      function formatUpdated(iso) {
        try {
          const d = new Date(iso);
          return new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Stockholm",
            weekday: "short",
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }).format(d) + " CEST";
        } catch (e) {
          return iso;
        }
      }

      function shortDate(iso) {
        try {
          const [y, m, d] = iso.split("-").map(Number);
          const dt = new Date(Date.UTC(y, m - 1, d));
          return new Intl.DateTimeFormat("en-GB", {
            weekday: "short",
            day: "numeric",
            month: "short",
            timeZone: "UTC"
          }).format(dt);
        } catch (e) {
          return iso;
        }
      }

      function findByDate(arr, date) {
        return (arr || []).find(function (x) { return x.date === date; }) || null;
      }

      function progressPercent(start, current, target) {
        if (![start, current, target].every(function (n) { return typeof n === "number" && Number.isFinite(n); })) return 0;
        const total = start - target;
        if (total <= 0) return 0;
        return Math.max(0, Math.min(100, ((start - current) / total) * 100));
      }

      function goalMetric(label, current, target, start, suffix) {
        const pct = progressPercent(start, current, target);
        return (
          '<div class="goal-metric card">' +
            '<div class="progress-label"><span>' + esc(label) + '</span><strong>' +
              esc(fmtNum(current, 1)) + esc(suffix) + ' → ' + esc(fmtNum(target, 1)) + esc(suffix) +
            '</strong></div>' +
            '<div class="progress-track" role="progressbar" aria-label="' + esc(label) + ' progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + esc(fmtNum(pct, 0)) + '">' +
              '<div class="progress-fill" style="width:' + pct.toFixed(1) + '%"></div>' +
            '</div>' +
            '<div class="progress-caption">' + esc(fmtNum(pct, 0)) + '% toward primary milestone</div>' +
          '</div>'
        );
      }

      function renderGoals(goals) {
        const progress = goals.progress || {};
        const assumptions = goals.assumptions || {};
        const rate = assumptions.lossRateKgPerWeek || {};
        const milestone = goals.preferredFirstMilestone || {};
        const scenarios = goals.scenarios || [];
        if (!Object.keys(progress).length) return '';

        return (
          '<section class="goals-section">' +
            '<div class="section-head"><h2>Goals &amp; timeline</h2><span class="hint">Primary milestone</span></div>' +
            '<div class="card goal-overview">' +
              '<p class="goal-target-note"><strong>' + esc(milestone.label || 'Primary milestone') + '</strong>' +
                (milestone.rationale ? ' · ' + esc(milestone.rationale) : '') + '</p>' +
              '<div class="grid cols-2 goal-progress-grid">' +
                goalMetric('Weight', progress.currentWeightKg, progress.primaryTargetWeightKg, progress.startWeightKg, ' kg') +
                goalMetric('Body fat', progress.currentFatPercent, progress.primaryTargetFatPercent, progress.startFatPercent, '%') +
              '</div>' +
            '</div>' +
            '<div class="scenario-grid">' +
              scenarios.map(function (scenario) {
                return (
                  '<article class="scenario-card' + (scenario.primary ? ' primary' : '') + '">' +
                    '<div class="scenario-top"><h3 class="scenario-title">' + esc(scenario.title) + '</h3>' +
                      (scenario.primary ? '<span class="scenario-badge">Primary</span>' : '') +
                    '</div>' +
                    '<p class="scenario-eta">' + esc(formatDateRange(scenario.etaStart, scenario.etaEnd)) +
                      ' · ' + esc(scenario.weeksMin) + '–' + esc(scenario.weeksMax) + ' weeks</p>' +
                    '<div class="scenario-stats">' +
                      '<div><span>Target</span><strong>' + esc(fmtNum(scenario.targetWeightKg, 1)) + ' kg · ' + esc(fmtNum(scenario.targetFatPercent, 1)) + '%</strong></div>' +
                      '<div><span>Lose approx.</span><strong>' + esc(fmtNum(scenario.kgToLoseApprox, 1)) + ' kg</strong></div>' +
                    '</div>' +
                    (scenario.note ? '<p class="scenario-note">' + esc(scenario.note) + '</p>' : '') +
                  '</article>'
                );
              }).join('') +
            '</div>' +
            '<p class="goal-assumption"><strong>Assumptions:</strong> ' + esc(assumptions.dailyDeficitKcal) + ' kcal/day deficit · ' +
              esc(rate.min) + '–' + esc(rate.max) + ' kg/week</p>' +
            '<p class="goal-disclaimer"><strong>Estimate, not a guarantee:</strong> depends on adherence, sleep, training, and measurement noise.</p>' +
          '</section>'
        );
      }

      function formatDateRange(start, end) {
        if (!start || !end) return start || end || 'ETA not set';
        return shortDate(start) + ' – ' + shortDate(end);
      }

      function typeBadge(type) {
        const t = (type || "rest").toLowerCase();
        return '<span class="badge ' + esc(t) + '">' + esc(t) + "</span>";
      }

      function renderMeals(day) {
        if (!day) {
          return '<div class="card"><p class="empty">No meal plan for this day yet.</p><p class="prompt">Tell Sarah to add it.</p></div>';
        }
        const m = day.meals || {};
        const rows = [
          ["Breakfast", m.breakfast],
          ["First meal (lunch)", m.lunch],
          ["Dinner", m.dinner],
          ["Snacks", m.snacks]
        ].filter(function (r) { return r[1]; });

        return (
          '<div class="card highlight">' +
            '<div class="meta-row" style="margin-bottom:.75rem">' +
              '<span class="pill">' + esc(day.dayName) + " · " + esc(day.date) + "</span>" +
              '<span>~' + esc(fmtNum(day.caloriesTargetApprox, 0)) + " kcal</span>" +
              '<span>Protein ≥ ' + esc(day.proteinFloorG) + " g</span>" +
            "</div>" +
            '<ul class="meal-list">' +
              rows.map(function (r) {
                return "<li><span class=\"slot\">" + esc(r[0]) + "</span><span>" + esc(r[1]) + "</span></li>";
              }).join("") +
            "</ul>" +
            (day.notes ? '<div class="notes">' + esc(day.notes) + "</div>" : "") +
          "</div>"
        );
      }

      function renderTraining(session) {
        if (!session) {
          return '<div class="card"><p class="empty">No session listed.</p></div>';
        }
        const bits = [];
        if (session.distanceKm != null) bits.push(session.distanceKm + " km");
        if (session.durationMin != null) bits.push("~" + session.durationMin + " min");
        if (session.startLocal) bits.push("start " + session.startLocal);
        if (session.location) bits.push(session.location);

        return (
          '<div class="card highlight">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">' +
              "<div><div class=\"stat-label\">" + esc(shortDate(session.date)) + "</div>" +
              '<div class="stat-value sm">' + esc(session.title) + "</div></div>" +
              typeBadge(session.type) +
            "</div>" +
            (bits.length ? '<div class="stat-sub" style="margin-top:.55rem">' + esc(bits.join(" · ")) + "</div>" : "") +
            (session.notes ? '<div class="notes">' + esc(session.notes) + "</div>" : "") +
          "</div>"
        );
      }

      function strengthCard(label, entry) {
        const logged = entry && entry.weightKg != null;
        return (
          '<div class="card">' +
            '<div class="stat-label">' + esc(label) + "</div>" +
            (logged
              ? '<div class="stat-value">' + esc(fmtNum(entry.weightKg, 1)) + ' <span style="font-size:.9rem;color:var(--muted)">kg</span></div>' +
                (entry.notes ? '<div class="stat-sub">' + esc(entry.notes) + "</div>" : "")
              : '<div class="stat-value empty" style="font-size:1.05rem">Not logged yet</div>' +
                '<p class="prompt">Tell Sarah when you hit a new mark.</p>') +
          "</div>"
        );
      }

      function render(data) {
        const today = localTodayISO();
        const tomorrow = addDaysISO(today, 1);
        const body = data.body || {};
        const fitness = data.fitness || {};
        const strength = data.strength || {};
        const meta = data.meta || {};
        const goals = data.goals || {};
        const guide = data.dailyGuide || {};
        const meals = data.weekMeals || [];
        const training = data.training || [];

        const todayMeal = findByDate(meals, today);
        const tomorrowMeal = findByDate(meals, tomorrow);
        const todayTrain = findByDate(training, today);

        const weekEnd = addDaysISO(today, 7);
        const weekGlance = [];
        for (let i = 0; i < 8; i++) {
          const d = addDaysISO(today, i);
          const t = findByDate(training, d);
          const m = findByDate(meals, d);
          weekGlance.push({ date: d, training: t, meal: m });
        }

        const parkruns = training.filter(function (t) {
          return t.type === "parkrun" && t.date >= today;
        });

        const weightTrend =
          body.priorJulyWeightKg != null
            ? '<div class="stat-sub trend-up">Jul baseline ' +
              esc(fmtNum(body.priorJulyWeightKg, 1)) +
              " kg → now " +
              esc(fmtNum(body.weightKg, 1)) +
              " kg</div>"
            : "";

        const be = fitness.bestEfforts || {};

        app.innerHTML =
          '<header class="hero">' +
            '<div class="eyebrow">Health & Fitness</div>' +
            "<h1>" + esc(meta.person || "Alex") + " · Dashboard</h1>" +
            '<div class="meta-row">' +
              '<span class="updated">Last updated: <time datetime="' + esc(meta.updatedAt) + '">' +
                esc(formatUpdated(meta.updatedAt)) + "</time></span>" +
              '<span class="pill">' + esc(meta.phase || "") + "</span>" +
            "</div>" +
            '<p class="goal"><strong>Goal:</strong> ' + esc(meta.goal || "") + "</p>" +
          "</header>" +

          renderGoals(goals) +

          '<section>' +
            '<div class="section-head"><h2>Body composition</h2><span class="hint">Withings</span></div>' +
            '<div class="grid cols-2 cols-4-lg">' +
              '<div class="card"><div class="stat-label">Weight</div><div class="stat-value">' + esc(fmtNum(body.weightKg, 1)) + ' kg</div>' + weightTrend + "</div>" +
              '<div class="card"><div class="stat-label">BMI</div><div class="stat-value">' + esc(fmtNum(body.bmi, 1)) + '</div><div class="stat-sub">' + esc(body.heightCm) + " cm</div></div>" +
              '<div class="card"><div class="stat-label">Body fat</div><div class="stat-value">' + esc(fmtNum(body.fatPercent, 1)) + '%</div><div class="stat-sub">' + esc(fmtNum(body.fatMassKg, 1)) + " kg fat mass</div></div>" +
              '<div class="card"><div class="stat-label">Muscle</div><div class="stat-value">' + esc(fmtNum(body.muscleKg, 1)) + ' kg</div><div class="stat-sub">Lean ' + esc(fmtNum(body.leanKg, 1)) + " kg</div></div>" +
              '<div class="card"><div class="stat-label">Visceral fat</div><div class="stat-value">' + esc(fmtNum(body.visceralFat, 1)) + '</div></div>' +
              '<div class="card"><div class="stat-label">Water / Bone</div><div class="stat-value sm">' + esc(fmtNum(body.waterKg, 0)) + ' / ' + esc(fmtNum(body.boneKg, 1)) + ' kg</div></div>' +
              '<div class="card"><div class="stat-label">BMR</div><div class="stat-value">' + esc(fmtNum(body.bmrKcal, 0)) + '</div><div class="stat-sub">kcal · met. age ' + esc(body.metabolicAge) + "</div></div>" +
              '<div class="card"><div class="stat-label">Vascular / Nerve</div><div class="stat-value sm">' + esc(body.vascularAgeRange) + '</div><div class="stat-sub">Nerve score ' + esc(body.nerveHealthScore) + " · PWV " + esc(fmtNum(body.pwv, 1)) + "</div></div>" +
            "</div>" +
            (body.sourceNote ? '<p class="source">' + esc(body.sourceNote) + "</p>" : "") +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Activity & sleep</h2></div>' +
            '<div class="grid cols-2 cols-4-lg">' +
              '<div class="card"><div class="stat-label">Steps (avg)</div><div class="stat-value">' + esc(fmtNum(body.stepsAvg, 0)) + '</div></div>' +
              '<div class="card"><div class="stat-label">Sleep</div><div class="stat-value">' + esc(fmtNum(body.sleepAsleepHours, 1)) + ' h</div><div class="stat-sub">' + esc(body.sleepEfficiencyPct) + "% efficiency</div></div>" +
              '<div class="card"><div class="stat-label">HR awake / asleep</div><div class="stat-value sm">' + esc(body.awakeHr) + " / " + esc(body.asleepHr) + '</div></div>' +
              '<div class="card"><div class="stat-label">Weekday sleep window</div><div class="stat-value sm">' + esc(body.weekdayBedtime) + " → " + esc(body.weekdayWake) + '</div></div>' +
            "</div>" +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Fitness & paces</h2><span class="hint">Strava</span></div>' +
            '<div class="grid cols-2">' +
              '<div class="card">' +
                '<div class="stat-label">2026 YTD</div>' +
                '<div class="stat-value sm">' + esc(fitness.year2026Runs) + " runs · " + esc(fmtNum(fitness.year2026Km, 1)) + " km</div>" +
                '<div class="stat-sub">' + esc(fitness.year2026Time) + " · +" + esc(fmtNum(fitness.elevM, 0)) + " m elev</div>" +
                '<div class="notes">' + esc(fitness.lastActivity) + (fitness.gapNote ? " · " + esc(fitness.gapNote) : "") + "</div>" +
              "</div>" +
              '<div class="card">' +
                '<div class="stat-label">Best efforts</div>' +
                '<div class="pace-row"><span>5K</span><span>' + esc(be["5k"] || "—") + "</span></div>" +
                '<div class="pace-row"><span>10K</span><span>' + esc(be["10k"] || "—") + "</span></div>" +
                '<div class="pace-row"><span>Half</span><span>' + esc(be.half || "—") + "</span></div>" +
                '<div class="notes">' + esc(fitness.currentPaceAssumption || "") + "</div>" +
              "</div>" +
            "</div>" +
            '<p class="source">' + esc(fitness.shortDistancePace || "") + " · " + esc(fitness.longDistancePace || "") + "</p>" +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Strength</h2><span class="hint">Farmers · RDL</span></div>' +
            '<div class="grid cols-2">' +
              strengthCard("Farmers carry", strength.farmersCarry) +
              strengthCard("Romanian deadlift", strength.romanianDeadlift) +
            "</div>" +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Today’s training</h2><span class="hint">' + esc(today) + "</span></div>" +
            renderTraining(todayTrain) +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Today’s meals</h2></div>' +
            renderMeals(todayMeal) +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Tomorrow’s meals</h2><span class="hint">' + esc(tomorrow) + "</span></div>" +
            renderMeals(tomorrowMeal) +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>This week at a glance</h2></div>' +
            '<div class="card" style="overflow-x:auto">' +
              '<table class="week-table">' +
                "<thead><tr><th>Day</th><th>Training</th><th>Meals focus</th></tr></thead>" +
                "<tbody>" +
                weekGlance.map(function (row) {
                  const isToday = row.date === today;
                  const t = row.training;
                  const m = row.meal;
                  const trainTxt = t
                    ? typeBadge(t.type) + " " + esc(t.title)
                    : '<span style="color:var(--muted)">—</span>';
                  const mealTxt = m
                    ? esc((m.meals && m.meals.dinner) || m.notes || "Plan set")
                    : "—";
                  return (
                    '<tr class="' + (isToday ? "today" : "") + '">' +
                      '<td class="day">' + esc(shortDate(row.date)) + (isToday ? " · today" : "") + "</td>" +
                      "<td>" + trainTxt + "</td>" +
                      "<td>" + mealTxt + "</td>" +
                    "</tr>"
                  );
                }).join("") +
                "</tbody>" +
              "</table>" +
            "</div>" +
            (parkruns.length
              ? '<p class="source" style="margin-top:.75rem"><strong>Upcoming ParkRuns:</strong> ' +
                parkruns.map(function (p) { return esc(shortDate(p.date)); }).join(" · ") +
                " (football overrides many Saturdays)</p>"
              : "") +
          "</section>" +

          '<section>' +
            '<div class="section-head"><h2>Daily guide</h2></div>' +
            '<div class="tips">' +
              '<div class="tip"><strong>Nutrition</strong>' + esc(guide.nutritionTip || "") + "</div>" +
              '<div class="tip"><strong>Sleep</strong>' + esc(guide.sleepTip || "") + "</div>" +
            "</div>" +
          "</section>" +

          '<footer>' +
            "Maintained by Sarah · Health & Fitness · Not medical advice" +
          "</footer>";
      }

      function fail(msg) {
        app.innerHTML = '<div class="error"><strong>Couldn’t load data.</strong><br/>' + esc(msg) + "</div>";
      }

      const bust = "t=" + Date.now();
      fetch("data.json?" + bust, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(render)
        .catch(function (err) {
          fail(err && err.message ? err.message : String(err));
        });
    })();
  </script>
</body>
</html>
